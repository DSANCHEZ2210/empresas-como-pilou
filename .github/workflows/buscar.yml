name: Buscar empresas como Pilou

on:
  workflow_dispatch:
    inputs:
      resultados:
        description: "Resultados por búsqueda"
        default: "10"
      minimo:
        description: "Parecido mínimo (0-100)"
        default: "40"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python buscar_empresas_como_pilou.py --resultados "${{ inputs.resultados }}" --minimo "${{ inputs.minimo }}"
      - uses: actions/upload-artifact@v4
        with:
          name: empresas-como-pilou
          path: resultados/
      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git commit -m "Resultados de la búsqueda $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
